kind = "mobile"
previewPath = "/"
title = "Toy’s Village"
description = "A supervised mobile prototype that turns toy tidy-up into imaginative village play. Explore the Time Game with musical toy-return feedback and the Color Game with spoken color prompts and simulated toy scans."
version = "1.0.0"
id = "artifacts/toys-village"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18741

[services.development]
run = "pnpm --filter @workspace/toys-village run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/toys-village", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/toys-village", "run", "serve" ]

[services.env]
PORT = "18741"
BASE_PATH = "/"
